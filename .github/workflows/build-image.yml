# Build-deport — construit l'image sur les runners GitHub (CPU/RAM libres),
# la BOOTE contre un Postgres jetable, puis la pousse sur ghcr.io.
#
# POURQUOI : jusqu'ici Coolify faisait `next build` SUR LE VPS de prod. Chaque
# déploiement saturait la RAM de l'hôte (OOM) → 15-20 min de blackout total
# (app + proxy + Coolify), reproduit 3× la nuit du 2026-07-12. En déportant le
# build ici, le VPS ne fait plus qu'un `docker pull` + swap de conteneur :
# aucun blackout. Cf. docs/deploy/BUILD-DEPORT.md pour la bascule Coolify.
#
# GARDE-FOU : l'image n'est poussée QUE si elle démarre et sert /login (200)
# contre un Postgres neuf — une image cassée n'atteint jamais le registre.
name: Build image (ghcr)

# DÉPLOIEMENT 100 % MANUEL (décision opérateur 2026-07-15) : aucun trigger
# automatique. Le push sur `main` ne construit PLUS d'image et ne redéploie PLUS.
# Pour livrer en prod : lancer CE workflow à la main (workflow_dispatch), cocher
# `notify_coolify` pour déclencher le swap Coolify — ou `deploy.yml`, ou le
# dashboard Coolify. Cf. docs/deploy/BUILD-DEPORT.md.
on:
  workflow_dispatch:
    inputs:
      notify_coolify:
        description: "Déclencher un redeploy Coolify après le build (source = Docker Image)"
        type: boolean
        default: false

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - name: Image name en minuscules (ghcr l'exige)
        id: img
        run: echo "ref=$(echo '${{ env.IMAGE }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Version depuis package.json
        id: ver
        run: echo "v=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Login ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Choisir la base Node officielle disponible (digest conservé)
        id: node_base
        run: |
          set -euo pipefail
          node_digest=sha256:c3de60bf2f9dd0ac6370e6117950ff62d6e339527e7472301c9c78a017978392
          node_image="public.ecr.aws/docker/library/node:22-bookworm-slim@$node_digest"
          if ! docker buildx imagetools inspect "$node_image" >/dev/null; then
            node_image="docker.io/library/node:22-bookworm-slim@$node_digest"
            docker buildx imagetools inspect "$node_image" >/dev/null
          fi
          echo "image=$node_image" >> "$GITHUB_OUTPUT"

      # 1) Build + chargement LOCAL (pas encore poussé) avec cache gha.
      - name: Build (load local)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          build-args: NODE_IMAGE=${{ steps.node_base.outputs.image }}
          tags: lafusee:candidate
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2) Smoke-test de démarrage : Postgres neuf → l'entrypoint applique les
      #    migrations → le serveur doit répondre 200 sur /login. Si l'image ne
      #    boote pas, on échoue AVANT de pousser.
      - name: Boot smoke-test (migrations + /login 200)
        run: |
          set -euo pipefail
          docker network create lf-smoke
          pg_digest=sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          pg_image="public.ecr.aws/docker/library/postgres:16-alpine@$pg_digest"
          if ! docker pull "$pg_image"; then
            pg_image="docker.io/library/postgres:16-alpine@$pg_digest"
            docker pull "$pg_image"
          fi
          docker run -d --name pg --network lf-smoke \
            -e POSTGRES_USER=lafusee -e POSTGRES_PASSWORD=lafusee -e POSTGRES_DB=lafusee \
            "$pg_image"
          echo "Attente Postgres…"
          for i in $(seq 1 30); do
            if docker exec pg pg_isready -U lafusee >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker run -d --name app --network lf-smoke -p 3000:3000 \
            -e DATABASE_URL="postgresql://lafusee:lafusee@pg:5432/lafusee?schema=public" \
            -e NEXTAUTH_SECRET="ci-smoke-secret-ci-smoke-secret-32ch" \
            -e AUTH_SECRET="ci-smoke-secret-ci-smoke-secret-32ch" \
            -e NEXTAUTH_URL="http://localhost:3000" \
            -e AUTH_URL="http://localhost:3000" \
            -e INTEGRATION_TOKEN_KEY="ci-smoke-integration-key-32-characters" \
            lafusee:candidate
          echo "Attente du serveur (migrations au boot incluses)…"
          ok=0
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:3000/login || echo 000)
            echo "  t=$((i*3))s /login=$code"
            if [ "$code" = "200" ]; then ok=1; break; fi
            sleep 3
          done
          if [ "$ok" != "1" ]; then
            echo "::error::L'image ne sert pas /login — logs conteneur :"
            docker logs app | tail -80
            exit 1
          fi
          echo "✓ image saine — démarre, migre, sert /login."
          # La page de connexion ne prouve pas que le endpoint de session rend du JSON.
          curl --fail --silent --show-error http://localhost:3000/api/auth/session \
            | node -e 'JSON.parse(require("fs").readFileSync(0,"utf8")); console.log("Anonymous session: HTTP 200 and valid JSON in exact image");'
          # La publication de pièce utilise le moteur natif dans JSDOM externe.
          # Vérifier ses fichiers runtime et le contexte VM dans le standalone exact.
          docker exec app node --input-type=module -e '
            import { JSDOM } from "jsdom";
            import { Script } from "node:vm";
            const dom = new JSDOM("<main></main>", { runScripts: "outside-only" });
            try {
              new Script("document.querySelector(\"main\").textContent = \"received\"")
                .runInContext(dom.getInternalVMContext());
              if (dom.window.document.querySelector("main").textContent !== "received")
                throw new Error("Native document context not received");
              console.log("JSDOM + native VM context received in exact image");
            } finally { dom.window.close(); }
          '
          # Le test unitaire ne détecte pas un worker PDF omis du standalone.
          # Exercer le lecteur installé dans l'image exacte avant publication.
          docker cp tests/fixtures/source-deposit.pdf app:/tmp/source-deposit.pdf
          docker exec app node --input-type=module -e '
            import { readFile } from "node:fs/promises";
            import { PDFParse } from "pdf-parse";
            const parser = new PDFParse({ data: new Uint8Array(await readFile("/tmp/source-deposit.pdf")) });
            try {
              const result = await parser.getText();
              if (result.total !== 2 || !result.text.includes("Source one: budget unknown.") || !result.text.includes("Source two: no approval inferred.")) {
                throw new Error("PDF standalone extraction failed");
              }
              console.log("PDF standalone: 2 pages, both source texts present");
            } finally { await parser.destroy(); }
          '
          docker rm -f app pg >/dev/null 2>&1 || true

      # 3) Push (cache chaud → quasi instantané) : latest + version + sha.
      - name: Push ghcr
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: NODE_IMAGE=${{ steps.node_base.outputs.image }}
          tags: |
            ${{ steps.img.outputs.ref }}:latest
            ${{ steps.img.outputs.ref }}:v${{ steps.ver.outputs.v }}
            ${{ steps.img.outputs.ref }}:sha-${{ github.sha }}
          cache-from: type=gha

      # 4) Notifier Coolify de TIRER la nouvelle image. En source « Docker Image »,
      #    un redeploy = pull de :latest + swap, sans build VPS → zéro OOM.
      #    DÉPLOIEMENT MANUEL UNIQUEMENT (2026-07-15) : ne se déclenche QUE sur un
      #    workflow_dispatch explicite avec `notify_coolify` coché. Le push sur
      #    main ne redéploie plus. No-op gardé si les secrets sont absents.
      - name: Redeploy Coolify (manuel — dispatch + notify_coolify)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.notify_coolify }}
        env:
          COOLIFY_URL: ${{ secrets.COOLIFY_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
          # Sert à VÉRIFIER que la prod a réellement basculé. Sans cette URL, on
          # ne peut que constater l'accusé de réception — et on le dit.
          PROD_URL: ${{ vars.PROD_URL }}
          EXPECTED_VERSION: ${{ steps.ver.outputs.v }}
        run: |
          set -uo pipefail
          if [ -z "${COOLIFY_URL:-}" ] || [ -z "${COOLIFY_TOKEN:-}" ] || [ -z "${COOLIFY_APP_UUID:-}" ]; then
            echo "Secrets Coolify absents — push effectué, redeploy à déclencher manuellement."
            exit 0
          fi

          # Déclenchement borné + réessayé.
          #
          # L'appel était `curl -sf` NU sous `set -e` : ni délai maximum, ni
          # réessai, ni `force`. Un accusé de réception lent (exit 28) faisait
          # donc échouer tout le job — alors que le déploiement était bel et
          # bien mis en file côté serveur. C'est le rouge observé le 2026-07-28 :
          # l'image était publiée, la prod n'avait simplement jamais été
          # redéployée, et le job disait « échec du build ».
          #
          # `force=true` : sur une ressource « Docker Image » au tag MUTABLE
          # (`latest`), c'est ce qui garantit le `docker pull` plutôt qu'un
          # redémarrage sur l'image déjà présente (cf. CLAUDE.md § Déploiement).
          triggered=0
          for attempt in 1 2 3; do
            code=$(curl -s -o /tmp/deploy.json -w '%{http_code}' --max-time 60 \
              -X POST "${COOLIFY_URL%/}/api/v1/deploy?uuid=${COOLIFY_APP_UUID}&force=true" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}") || code="000"
            if [ "$code" = "200" ]; then
              echo "Redeploy Coolify déclenché (tentative $attempt)."
              cat /tmp/deploy.json 2>/dev/null || true
              triggered=1
              break
            fi
            echo "::warning::Déclenchement Coolify — code=$code (tentative $attempt/3)."
            sleep $((attempt * 10))
          done

          # Sans URL publique, on ne peut pas vérifier : on reste sur le verdict
          # du déclenchement, honnêtement annoncé comme tel.
          if [ -z "${PROD_URL:-}" ]; then
            if [ "$triggered" = "1" ]; then
              echo "::notice::Déclenché. Bascule NON vérifiée (variable PROD_URL absente)."
              exit 0
            fi
            echo "::error::Déclenchement Coolify impossible après 3 tentatives."
            exit 1
          fi

          # Le job ne dit vert que si la prod SERT la nouvelle version. Un
          # déclenchement accepté n'est pas un déploiement réussi ; et un
          # déclenchement expiré n'est pas forcément un échec — seule la version
          # servie tranche.
          echo "Attente de la bascule vers v${EXPECTED_VERSION} sur ${PROD_URL} …"
          for i in $(seq 1 60); do
            served=$(curl -s --max-time 15 "${PROD_URL%/}/api/version" | tr -d ' \n')
            case "$served" in
              *"${EXPECTED_VERSION}"*)
                echo "✓ prod sert v${EXPECTED_VERSION}."
                exit 0;;
            esac
            sleep 15
          done
          echo "::error::Après 15 min, la prod ne sert toujours pas v${EXPECTED_VERSION} (dernier relevé : ${served:-vide})."
          exit 1

      - name: Résumé
        run: |
          {
            echo "## Image publiée"
            echo ""
            echo '`${{ steps.img.outputs.ref }}:latest`'
            echo '`${{ steps.img.outputs.ref }}:v${{ steps.ver.outputs.v }}`'
            echo ""
            echo "Build déporté (runners GitHub) — le VPS ne fait plus de \`next build\`."
            echo "Bascule Coolify : voir \`docs/deploy/BUILD-DEPORT.md\`."
          } >> "$GITHUB_STEP_SUMMARY"
